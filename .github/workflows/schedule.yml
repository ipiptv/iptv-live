name: update schedule

on:
  schedule:
    # 三班，间隔 8 小时：UTC 21:30 / 05:30 / 13:30 = 北京 05:30 / 13:30 / 21:30
    - cron: "30 21,5,13 * * *"
  workflow_dispatch:
# ← 添加这行，允许手动触发测试

permissions:
  contents: write

# 同一时间只允许一个发布任务，避免定时与手动触发互相覆盖
concurrency:
  group: publish-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
            echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install
      - run: pnpm build
      - run: pnpm m3u
        env:
          IPTV_PROXY_IP_RANGES: ${{ vars.IPTV_PROXY_IP_RANGES }}
          IPTV_PROXY_PORT: ${{ vars.IPTV_PROXY_PORT }}

      # ↓ 以下三步必须在 pnpm m3u 之后：pnpm m3u 启动时会清空整个 m3u/ 目录
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencc-python-reimplemented
      - name: Run bbxx365 script (output into m3u/)
        timeout-minutes: 30
        run: python main.py

      - name: Merge bbxx365 + hotel_tvn (whitelist)
        run: python scripts/merge_bbxx365_hotel.py

      # 迷你版：只留央视/卫视/专享/4K/国际台，每频道 2 条源，约 70KB。
      # 国内弱网或播放器超时短时，小文件才下得完。
      - name: Build mini playlist (small file for weak networks)
        timeout-minutes: 10
        run: python scripts/make_mini.py --verify

      # 国内直连 pages.dev 会因限速中断（URLSession 报"网络连接已中断"），
      # 故把产物镜像到 publish 分支，供 raw.githubusercontent / 加速代理 拉取。
      # 用 orphan + force push，分支上永远只有一个提交，不会无限膨胀。
      - name: Mirror m3u to publish branch (CN-friendly source)
        run: |
          set -e
          mkdir -p /tmp/pub && cd /tmp/pub
          git init -q -b publish
          for f in bbxx365.m3u bbxx365_lite.m3u bbxx365_hotel.m3u bbxx365_mini.m3u bbxx365.txt bbxx365_lite.txt; do
            [ -f "$GITHUB_WORKSPACE/m3u/$f" ] && cp "$GITHUB_WORKSPACE/m3u/$f" .
          done
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "publish $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" publish

      - run: sudo apt-get install -y tree

      - name: Publish m3u (Cloudflare direct upload or empty commit)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME || secrets.PROJECT_NAME }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
            pnpm static
            # 站点首页渲染的是 README.md，必须一起放进发布目录，否则页面空白
            cp README.md m3u/ 2>/dev/null || true
            cp LIST.temp.md m3u/ 2>/dev/null || true
            tree m3u
            npx wrangler pages deploy m3u --project-name="${PROJECT_NAME}" --branch=main
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: schedule refresh (trigger Cloudflare Pages build)"
            git push
          fi

      # - name: "Jekyll theme"
