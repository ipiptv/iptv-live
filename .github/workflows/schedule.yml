name: update schedule

on:
  schedule:
    # 三班，间隔 8 小时：UTC 21:30 / 05:30 / 13:30 = 北京 05:30 / 13:30 / 21:30
    - cron: "30 21,5,13 * * *"
  workflow_dispatch:
# ← 添加这行，允许手动触发测试

permissions:
  contents: write

# 同一时间只允许一个发布任务，避免定时与手动触发互相覆盖
concurrency:
  group: publish-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # 失效缓存 / 主机信誉库：不进仓库（data/ 被忽略），用 cache 当"滚动状态"，
      # 每次跑完自动存一份新的，下次优先取最近的一份。7 天没跑缓存被清时从空开始。
      - name: Restore stream-check state
        uses: actions/cache@v4
        with:
          path: data/stream-check
          key: stream-check-${{ github.run_id }}
          restore-keys: |
            stream-check-

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
            echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install
      - run: pnpm build
      - run: pnpm m3u
        # 抓上游源：单个源已在代码里限 20 秒 × 2 次重试；这里再加整步上限 12 分钟，
        # 超时就带着已抓到的继续往下走（不中断后续合并/发布），避免整轮被几个死链拖到 20+ 分钟
        timeout-minutes: 12
        continue-on-error: true
        env:
          IPTV_PROXY_IP_RANGES: ${{ vars.IPTV_PROXY_IP_RANGES }}
          IPTV_PROXY_PORT: ${{ vars.IPTV_PROXY_PORT }}

      # ↓ 以下三步必须在 pnpm m3u 之后：pnpm m3u 启动时会清空整个 m3u/ 目录
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencc-python-reimplemented
      - name: Run bbxx365 script (output into m3u/)
        timeout-minutes: 30
        run: python main.py

      # 全集版只删「完全重复」：同一个频道名 + 同一个播放地址（分组标签不同也算重复）。
      # 同频道不同地址的备用源全部保留，顺序不动。
      - name: Dedupe exact duplicates (bbxx365.m3u)
        run: python scripts/dedupe_exact.py m3u/bbxx365.m3u

      # 上游源列表同步：把 kimwang1978/collect-txt 的 主频道/专区/地方台/手工区/*.txt
      # 镜像过来（只新增和更新，本地改过的不覆盖，上游删的保留），再回写仓库，
      # 这样上游加了新源地址，本仓库第二天就跑到了。
      - name: Sync upstream source lists
        timeout-minutes: 10
        run: python scripts/sync_upstream_sources.py
        env:
          UPSTREAM_REPO: kimwang1978/collect-txt

      - name: Commit upstream sync (only when changed)
        run: |
          set -e
          git config user.name "iptv-bot"
          git config user.email "ipiptv@users.noreply.github.com"
          git add 主频道 专区 地方台 手工区 data/upstream_sync_state.json
          # 关键源的落盘兜底缓存（拉不到上游时用它续命），也要跟着仓库走
          if [ -d data/upstream-cache ]; then
            git add data/upstream-cache
            find data/upstream-cache -name '*.m3u' -exec ls -l {} \; | awk '{print "缓存:", $9, $5, "字节"}'
          else
            echo "未生成 data/upstream-cache（本轮上游全部拉取成功或未命中白名单）"
          fi
          if git diff --cached --quiet; then
            echo "上游源列表与缓存均无变化，跳过提交"
          else
            git commit -m "chore: 同步上游源列表与缓存 $(date -u '+%Y-%m-%d %H:%M UTC')"
            # 期间可能有别的提交落到 main（例如临时触发的回滚），先 rebase 再推，避免 non-fast-forward
            if ! git push origin HEAD:main; then
              git fetch -q origin main
              git rebase -X ours origin/main || git rebase --abort || true
              git push origin HEAD:main
            fi
            echo "已提交并推送上游更新"
          fi

      - name: Merge bbxx365 + hotel_tvn (whitelist)
        env:
          # 付费源订阅地址含账号凭证，走 Secret，不写进仓库
          OTT_SUB_URL: ${{ secrets.OTT_SUB_URL }}
        run: python scripts/merge_bbxx365_hotel.py

      # 迷你版：只留央视/卫视/专享/4K/国际台，每频道 2 条源，约 70KB。
      # 国内弱网或播放器超时短时，小文件才下得完。
      - name: Build mini playlist (small file for weak networks)
        timeout-minutes: 10
        run: python scripts/make_mini.py --verify

      # 生成后台页用的清单元数据（条数/分组/更新时间），随产物一起发布，
      # 页面读它就能显示最新数字，不用手改 admin.html
      - name: Build sources manifest (m3u/sources.json)
        run: python scripts/build_sources_json.py

      # 体检：复检已过期的失效地址（恢复就放行），顺带轮转抽样发现新失效。
      # 默认只记"与网络位置无关"的硬错误（连接失败/404），超时和 403 一律忽略——
      # 跑在海外 CI 上的超时不能证明国内看不了。
      - name: Stream health check (failure cache + host reputation)
        timeout-minutes: 20
        run: python scripts/stream_check.py --budget 1800 --discover 500

      # 国内直连 pages.dev 会因限速中断（URLSession 报"网络连接已中断"），
      # 故把产物镜像到 publish 分支，供 raw.githubusercontent / 加速代理 拉取。
      # 用 orphan + force push，分支上永远只有一个提交，不会无限膨胀。
      - name: Mirror m3u to publish branch (CN-friendly source)
        run: |
          set -e
          PUBURL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          # 先拉回现有 publish 分支，保留本仓库生成不了的文件（bbxx365_mini_home.m3u 只能在家里网络实测产出），
          # 避免每次流水线把它冲掉、订阅地址 404。
          git clone -q --depth 1 -b publish "$PUBURL" /tmp/pub || ( cd /tmp/pub && git init -q -b publish && git remote add origin "$PUBURL" )
          cd /tmp/pub
          for f in bbxx365.m3u bbxx365_lite.m3u bbxx365_hotel.m3u bbxx365_ott.m3u bbxx365_mini.m3u bbxx365_mini_home.m3u bbxx365.txt bbxx365_lite.txt sources.json; do
            [ -f "$GITHUB_WORKSPACE/m3u/$f" ] && cp "$GITHUB_WORKSPACE/m3u/$f" .
          done
          # 后台管理页也镜像过去，供 GitHub Pages 直接当网页打开
          [ -f "$GITHUB_WORKSPACE/admin.html" ] && cp "$GITHUB_WORKSPACE/admin.html" .
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "publish $(date -u +%Y-%m-%dT%H:%MZ)" || true
          git push -f "$PUBURL" publish

      # 站点发布已停用（2026-11-16）：pages.dev 在国内时通时断，浏览入口改用
      # Gitee 仓库首页（gitee.com/IptvIptv/Iptv，README 直接渲染）。Cloudflare 项目和
      # 最后一版部署仍保留，需要恢复时把下面这段取消注释即可。
      # - run: sudo apt-get install -y tree
      #
      # - name: Publish m3u (Cloudflare direct upload or empty commit)
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #     PROJECT_NAME: ${{ vars.PROJECT_NAME || secrets.PROJECT_NAME }}
      #   run: |
      #     if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
      #       pnpm static
      #       cp /tmp/pub/bbxx365_mini_home.m3u m3u/ 2>/dev/null || true
      #       cp README.md m3u/ 2>/dev/null || true
      #       cp LIST.temp.md m3u/ 2>/dev/null || true
      #       tree m3u
      #       npx wrangler pages deploy m3u --project-name="${PROJECT_NAME}" --branch=main
      #     else
      #       git config user.name "github-actions[bot]"
      #       git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      #       git commit --allow-empty -m "chore: schedule refresh (trigger Cloudflare Pages build)"
      #       git push
      #     fi

      # 同步一份到 Gitee（国内访问快）。Gitee 会审查仓库内容，含 VOA/美国之音的条目
      # 会让整份 m3u 变成 451，所以这里推的是剔除这些条目后的干净版；
      # GitHub raw 仍然是完整版本。
      # EPG 节目单：直接拉 ipiptv/EPG 的 output 分支整包，解出所有 xml
      - name: Fetch EPG xml (all categories from ipiptv/EPG output branch)
        continue-on-error: true
        run: |
          set -e
          rm -rf /tmp/epgpkg && mkdir -p /tmp/epgpkg
          url="https://codeload.github.com/ipiptv/EPG/tar.gz/refs/heads/output"
          if curl -fsSL --retry 3 --max-time 180 "$url" -o /tmp/epgpkg/epg.tar.gz; then
            tar -xzf /tmp/epgpkg/epg.tar.gz -C /tmp/epgpkg
            found=$(find /tmp/epgpkg -maxdepth 3 -type f \( -name '*.xml' -o -name '*.xml.gz' \) | wc -l)
            if [ "$found" -gt 0 ]; then
              find /tmp/epgpkg -maxdepth 3 -type f \( -name '*.xml' -o -name '*.xml.gz' \) -exec cp {} m3u/ \;
              ls -l m3u/*.xml m3u/*.xml.gz 2>/dev/null | awk '{print "已获取 EPG:", $9, $5, "字节"}'
            else
              echo "整包里没有 xml，跳过"
            fi
          else
            echo "节目单整包下载失败，跳过（本轮不同步 EPG）"
          fi

      - name: Sync m3u to Gitee (CN-friendly mirror)
        env:
          GITEE_SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          set -o pipefail
          bash scripts/gitee_sync.sh 2>&1 | tee /tmp/gitee_sync.log

      # 同步失败时把日志留在仓库里，方便排查（失败不影响其它步骤）
      - name: Record Gitee sync log (on failure)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sync-logs
          { echo "--- run ${GITHUB_RUN_ID} at $(date -u) ---"; tail -80 /tmp/gitee_sync.log 2>/dev/null || echo "无日志"; } > sync-logs/gitee_sync_last.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sync-logs/gitee_sync_last.log
          git commit -q -m "log: gitee sync failure ${GITHUB_RUN_ID}" || true
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/logs || true

