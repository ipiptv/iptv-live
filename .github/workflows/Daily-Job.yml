name: 'Daily Job (manual only)'
# 定时发布已统一由 schedule.yml 负责（每天两次，产物直接发到 Pages）。
# 本工作流只在需要单独跑一次脚本 / 下载产物留档时手动触发。
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
jobs:
  run_job:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install opencc-python-reimplemented
    - name: Run Python script
      run: python main.py
    - name: Upload generated m3u artifact
      uses: actions/upload-artifact@v4
      with:
        name: bbxx365-output
        path: m3u/
