name: update yiqikan

on:
  schedule:
    # 每 3 小时一次（北京时间 02:15 / 05:15 / 08:15 …），比主力源跑得勤
    - cron: "15 */3 * * *"
  push:
    paths:
      - "scripts/build_yiqikan.py"
      - ".github/workflows/yiqikan.yml"
  workflow_dispatch:

permissions:
  contents: write

# 与主流水线共用一个组：都要写 publish 分支，串行执行避免互相覆盖
concurrency:
  group: publish-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # 上游拉不到时用上次的缓存兜底（data/ 不进仓库，靠 cache 滚动保存）
      - name: Restore yiqikan cache
        uses: actions/cache@v4
        with:
          path: data/yiqikan-cache
          key: yiqikan-${{ github.run_id }}
          restore-keys: |
            yiqikan-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build yiqikan.m3u
        run: python3 scripts/build_yiqikan.py

      # 去掉测试频道（一起看里拼进来的「测试」直播位不要）
      - name: Drop test channels
        run: python3 scripts/sort_by_quality.py --clean-only

      # 只镜像到 publish 分支，Gitee 不同步（那边审核会拦）
      - name: Mirror yiqikan.m3u to publish branch
        run: |
          set -e
          PUBURL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          git clone -q --depth 1 -b publish "$PUBURL" /tmp/pub || (mkdir -p /tmp/pub && cd /tmp/pub && git init -q -b publish && git remote add origin "$PUBURL")
          cd /tmp/pub
          if [ -f "$GITHUB_WORKSPACE/m3u/yiqikan.m3u" ]; then cp "$GITHUB_WORKSPACE/m3u/yiqikan.m3u" .; fi
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "yiqikan $(date -u +%Y-%m-%dT%H:%MZ)" || true
          git push -f "$PUBURL" publish

      # jsDelivr 会缓存分支文件，推完主动清一次，订阅端马上能拿到新的
      - name: Purge jsDelivr cache
        run: |
          curl -sS --max-time 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@publish/yiqikan.m3u" || true
