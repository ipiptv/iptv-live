<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV 源管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }
        .header {
            max-width: 1000px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 24px;
        }
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .btn-primary {
            background: #38bdf8;
            color: #0f172a;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .settings-bar {
            max-width: 1000px;
            margin: 0 auto 20px;
            background: #1e293b;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #334155;
        }
        .settings-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .settings-row input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 13px;
        }
        .source-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            border: 1px solid #334155;
        }
        .source-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .source-name {
            font-size: 16px;
            font-weight: 600;
        }
        .source-actions {
            display: flex;
            gap: 8px;
        }
        .source-url {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            color: #4ade80;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background: #1e293b;
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #334155;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 14px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 8px;
        }
        .badge-green {
            background: #22c55e;
            color: white;
        }
        .badge-orange {
            background: #f97316;
            color: white;
        }
        .badge-blue {
            background: #38bdf8;
            color: #0f172a;
        }
        .sync-status {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📺 IPTV 源管理中心</h1>
        <button class="btn btn-primary" onclick="showModal()">+ 添加源</button>
    </div>

    <div class="settings-bar">
        <div class="settings-row">
            <input type="text" id="github-token" placeholder="GitHub Token（用于同步配置）" value="">
            <input type="text" id="github-repo" placeholder="仓库名，如 ipiptv/collect-txt" value="ipiptv/iptv-sources">
            <button class="btn btn-secondary" onclick="loadFromGitHub()">同步</button>
        </div>
        <div class="sync-status" id="sync-status">未同步</div>
    </div>

    <div class="container">
        <div class="sync-status" id="meta-line" style="margin-bottom:12px;"></div>
        <div id="source-list"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">添加新源</div>
            <div class="form-group">
                <label>名称</label>
                <input type="text" id="source-name" placeholder="例如：纯净版、央视、卫视">
            </div>
            <div class="form-group">
                <label>地址 (URL)</label>
                <input type="text" id="source-url" placeholder="https://example.com/source.m3u">
            </div>
            <div class="form-group">
                <label>备注（可选）</label>
                <input type="text" id="source-note" placeholder="例如：已测速、每日更新">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="hideModal()">取消</button>
                <button class="btn btn-primary" onclick="saveSource()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // 预设订阅：指向本流水线自己的产物（Gitee 镜像，国内直连），内容由云端自动覆盖，
        // 条数/更新时间从同目录 sources.json 自动读取，不需要手改这个页面。
        const DEFAULT_SOURCES = [
            { id: 1, name: '合并版（主力）', url: 'https://gitee.com/IptvIptv/Iptv/raw/master/bbxx365_hotel.m3u', note: '酒店源 + 付费源', tested: true },
            { id: 2, name: '全集版', url: 'https://gitee.com/IptvIptv/Iptv/raw/master/bbxx365.m3u', note: '全部源，最杂', tested: false },
            { id: 3, name: '精简版', url: 'https://gitee.com/IptvIptv/Iptv/raw/master/bbxx365_lite.m3u', note: '挑过的常规源', tested: false },
            { id: 4, name: '迷你版', url: 'https://gitee.com/IptvIptv/Iptv/raw/master/bbxx365_mini.m3u', note: '弱网 / 播放器超时短', tested: false },
            { id: 5, name: '本机实测版', url: 'https://gitee.com/IptvIptv/Iptv/raw/master/bbxx365_mini_home.m3u', note: '家里联通实测', tested: true },
            { id: 6, name: '酒店源', url: 'https://gitee.com/IptvIptv/Iptv/raw/master/hotel_tvn.m3u', note: '频道少但相对稳', tested: false }
        ];

        // 默认列表的版本号：一旦这里的预设换了，浏览器里存的旧列表会自动作废，
        // 免得打开页面还显示上一次的旧订阅（这就是之前"改了又被覆盖"的真相）。
        const DEFAULT_VERSION = 'v2026-11-18';

        function loadStoredSources() {
            try {
                const raw = JSON.parse(localStorage.getItem('iptv_sources'));
                if (raw && raw.__v === DEFAULT_VERSION && Array.isArray(raw.list)) {
                    return raw.list;
                }
            } catch (e) { /* 解析失败就当没有 */ }
            return null;
        }

        let sources = loadStoredSources() || [...DEFAULT_SOURCES];
        let meta = {};
        let metaUpdatedAt = '';
        let editingId = null;
        let configSha = null;

        // 从本地存储加载 Token 和仓库
        document.getElementById('github-token').value = localStorage.getItem('github_token') || '';
        document.getElementById('github-repo').value = localStorage.getItem('github_repo') || 'ipiptv/iptv-sources';

        function saveToLocal() {
            localStorage.setItem('iptv_sources', JSON.stringify({ __v: DEFAULT_VERSION, list: sources }));
        }

        function fileOf(url) {
            return (url || '').split('#')[0].split('?')[0].split('/').pop();
        }

        function countBadge(url) {
            const it = meta[fileOf(url)];
            if (!it || !it.count) return '';
            return `<span class="badge badge-green">${it.count} 条 · ${it.groups || '?'} 组</span>`;
        }

        // 每次打开页面都重新拉一次产物清单，条数和更新时间跟着流水线走
        async function loadMeta() {
            const urls = [
                'https://raw.githubusercontent.com/ipiptv/iptv-sources/publish/sources.json',
                'https://gitee.com/IptvIptv/Iptv/raw/master/sources.json',
                'm3u/sources.json'
            ];
            for (const u of urls) {
                try {
                    const r = await fetch(u, { cache: 'no-store' });
                    if (!r.ok) continue;
                    const j = await r.json();
                    if (!j || !j.sources) continue;
                    meta = {};
                    j.sources.forEach(it => { meta[it.file] = it; });
                    metaUpdatedAt = j.updated_at_cst || j.updated_at || '';
                    updateMetaLine();
                    render();
                    return;
                } catch (e) { /* 换下一个源 */ }
            }
        }

        function updateMetaLine() {
            const el = document.getElementById('meta-line');
            if (el) {
                el.textContent = metaUpdatedAt ? `产物更新时间：${metaUpdatedAt}（北京时间，每天自动更新 3 次）` : '';
            }
        }

        function render() {
            const container = document.getElementById('source-list');
            container.innerHTML = sources.map(s => `
                <div class="source-card">
                    <div class="source-header">
                        <div>
                            <span class="source-name">${s.name}</span>
                            ${s.tested ? '<span class="badge badge-green">已测速</span>' : '<span class="badge badge-orange">未测速</span>'}
                            ${s.note ? `<span class="badge badge-blue">${s.note}</span>` : ''}
                            ${countBadge(s.url)}
                        </div>
                        <div class="source-actions">
                            <button class="btn btn-secondary" onclick="editSource(${s.id})">编辑</button>
                            <button class="btn btn-danger" onclick="deleteSource(${s.id})">删除</button>
                        </div>
                    </div>
                    <div class="source-url">
                        <span>${s.url}</span>
                        <button class="btn btn-primary" onclick="copyUrl('${s.url}')">复制</button>
                    </div>
                </div>
            `).join('');
        }

        function showModal(id = null) {
            editingId = id;
            if (id) {
                const s = sources.find(x => x.id === id);
                document.getElementById('modal-title').textContent = '编辑源';
                document.getElementById('source-name').value = s.name;
                document.getElementById('source-url').value = s.url;
                document.getElementById('source-note').value = s.note || '';
            } else {
                document.getElementById('modal-title').textContent = '添加新源';
                document.getElementById('source-name').value = '';
                document.getElementById('source-url').value = '';
                document.getElementById('source-note').value = '';
            }
            document.getElementById('modal').classList.add('show');
        }

        function hideModal() {
            document.getElementById('modal').classList.remove('show');
            editingId = null;
        }

        async function saveSource() {
            const name = document.getElementById('source-name').value.trim();
            const url = document.getElementById('source-url').value.trim();
            const note = document.getElementById('source-note').value.trim();
            
            if (!name || !url) {
                alert('请填写名称和地址');
                return;
            }

            if (editingId) {
                const s = sources.find(x => x.id === editingId);
                s.name = name;
                s.url = url;
                s.note = note;
            } else {
                sources.push({
                    id: Date.now(),
                    name,
                    url,
                    note,
                    tested: false
                });
            }

            saveToLocal();
            render();
            hideModal();
            await syncToGitHub();
        }

        async function deleteSource(id) {
            if (confirm('确定删除这个源吗？')) {
                sources = sources.filter(x => x.id !== id);
                saveToLocal();
                render();
                await syncToGitHub();
            }
        }

        function editSource(id) {
            showModal(id);
        }

        function copyUrl(url) {
            navigator.clipboard.writeText(url).then(() => {
                alert('已复制：' + url);
            });
        }

        async function loadFromGitHub() {
            const token = document.getElementById('github-token').value.trim();
            const repo = document.getElementById('github-repo').value.trim();
            
            if (!token || !repo) {
                alert('请填写 GitHub Token 和仓库名');
                return;
            }

            localStorage.setItem('github_token', token);
            localStorage.setItem('github_repo', repo);

            document.getElementById('sync-status').textContent = '正在从 GitHub 读取...';

            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/iptv_config.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    configSha = data.sha;
                    const content = decodeURIComponent(escape(atob(data.content)));
                    sources = JSON.parse(content);
                    saveToLocal();
                    render();
                    document.getElementById('sync-status').textContent = '✅ 已从 GitHub 同步';
                } else {
                    document.getElementById('sync-status').textContent = '⚠️ 配置文件不存在，将创建新的';
                    configSha = null;
                }
            } catch (e) {
                document.getElementById('sync-status').textContent = '❌ 同步失败：' + e.message;
            }
        }

        async function syncToGitHub() {
            const token = document.getElementById('github-token').value.trim();
            const repo = document.getElementById('github-repo').value.trim();
            
            if (!token || !repo) {
                document.getElementById('sync-status').textContent = '⚠️ 未配置 GitHub Token，仅保存在本地';
                return;
            }

            document.getElementById('sync-status').textContent = '正在同步到 GitHub...';

            try {
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(sources, null, 2))));
                
                let url = `https://api.github.com/repos/${repo}/contents/iptv_config.json`;
                let body = {
                    message: 'update iptv config',
                    content: content
                };

                if (configSha) {
                    body.sha = configSha;
                }

                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (res.ok) {
                    const data = await res.json();
                    configSha = data.content.sha;
                    document.getElementById('sync-status').textContent = '✅ 已同步到 GitHub';
                } else {
                    const err = await res.json();
                    document.getElementById('sync-status').textContent = '❌ 同步失败：' + err.message;
                }
            } catch (e) {
                document.getElementById('sync-status').textContent = '❌ 同步失败：' + e.message;
            }
        }

        // 页面加载时自动同步
        window.onload = function() {
            render();
            loadMeta();
            const token = document.getElementById('github-token').value.trim();
            const repo = document.getElementById('github-repo').value.trim();
            if (token && repo) {
                loadFromGitHub();
            }
        };
    </script>
</body>
</html>
